<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <!-- resizes-content: the keyboard shrinks the layout viewport, so the pinned composer stays above it instead of the browser scrolling the whole page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1b1b1b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    %sveltekit.head%
  </head>
  <body class="h-full" data-sveltekit-preload-data="hover">
    <div class="h-full">%sveltekit.body%</div>
  </body>
</html>
