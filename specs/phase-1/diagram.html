<title>Phase 1 Map</title>
<style>
/* Layout: three figures, each one claim: the parts, one steered turn, the build order. */
:root{
  --bg:#fbfaf8;--fg:#1d1d21;--muted:#62626b;--panel:#f1f0ed;--line:#9a9aa3;--accent:#4f46e5;--done:#1f8a4c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1d;--fg:#ececec;--muted:#a1a1a8;--panel:#26262a;--line:#5b5b63;--accent:#9d8cff;--done:#3fd070;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1b1d;--fg:#ececec;--muted:#a1a1a8;--panel:#26262a;--line:#5b5b63;--accent:#9d8cff;--done:#3fd070;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding-inline:max(16px,4vw);padding-block:28px 56px}
main{max-width:1040px;margin:0 auto}
h1{font-size:1.6rem;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 28px;max-width:62ch}
figure{margin:0 0 40px}
figcaption{color:var(--muted);font-size:14px;max-width:70ch;margin-top:10px}
figcaption b{color:var(--fg)}
.scroll{overflow-x:auto}
svg{display:block;width:100%;height:auto;min-width:720px;color:var(--fg)}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.acc{stroke:var(--accent);stroke-width:2}
.dash{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:6 5}
.ln{stroke:currentColor;stroke-width:1.4;fill:none}
.lna{stroke:var(--accent);stroke-width:2;fill:none}
.life{stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
svg text{fill:currentColor;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.t{font-weight:600;font-size:13px}
.m{fill:var(--muted);font-size:11px}
.l{fill:var(--muted);font-size:10.5px}
.ta{fill:var(--accent);font-weight:600;font-size:13px}
.la{fill:var(--accent);font-size:10.5px;font-weight:600}
.done{fill:var(--panel);stroke:var(--done);stroke-width:2}
.ok{fill:var(--done);font-size:11px;font-weight:600}
</style>

<figcaption><b>Everything phase 1 builds.</b> agy touches the daemon in three places: the driver (ACP), the tool server (MCP) and the proxy (model traffic, in violet). Only the proxy reaches the provider, which is why compression, Ponytail and steering live there once. A steer takes one of two routes, <b>inject</b> into the next request or <b>wake</b> a finished turn.</figcaption>
</figure>

<figcaption><b>One steered turn.</b> Steps 2 to 7 are the inject route: the proxy adds the steer to the request that carries tool results, remembers it by tool call id, and replays identical bytes later so the prompt cache holds. Steps 8 and 9 are the wake route, used when the turn ends before another request comes. Background-exit notices ride the same queue.</figcaption>
</figure>
